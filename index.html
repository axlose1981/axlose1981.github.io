<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>심플 로또 번호 추첨기</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>행운의 로또 추첨기</h1>
            <p>원하는 세트 수를 선택하고 번호를 뽑아보세요.</p>
        </header>

        <main>
            <div class="controls">
                <div class="select-wrapper">
                    <label for="set-count">세트 수:</label>
                    <select id="set-count">
                        <option value="1">1게임</option>
                        <option value="2">2게임</option>
                        <option value="3" selected>3게임</option>
                        <option value="4">4게임</option>
                        <option value="5">5게임</option>
                    </select>
                </div>
                <button id="generate-btn">번호 뽑기</button>
            </div>

            <div id="results" class="results-container">
                <!-- 결과가 여기에 표시됩니다 -->
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
